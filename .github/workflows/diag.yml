name: diag

# TEMPORARY diagnostic workflow — not triggered by push, only manually.
# Purpose: find a portable path that makes mkdirSync(recursive) fail FAST on
# Linux, to replace the `/proc/...` fixture that hangs Node on procfs.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe portable unwritable paths
        run: |
          set +e
          cat > /tmp/probe.cjs <<'JS'
          const { mkdirSync, mkdtempSync, writeFileSync } = require("node:fs");
          const { tmpdir } = require("node:os");
          const { join } = require("node:path");
          const dir = mkdtempSync(join(tmpdir(), "probe-"));
          const name = process.env.PROBE;
          const t = Date.now();
          try {
            if (name === "under-file") {
              const blocker = join(dir, "blocker");
              writeFileSync(blocker, "");
              mkdirSync(join(blocker, "nested", ".huginn", "receipts"), { recursive: true, mode: 0o700 });
            } else if (name === "dev-null-child") {
              mkdirSync("/dev/null/x/y", { recursive: true, mode: 0o700 });
            } else if (name === "readonly-dir") {
              const ro = join(dir, "ro");
              mkdirSync(ro, { mode: 0o500 });
              mkdirSync(join(ro, "x", "y"), { recursive: true, mode: 0o700 });
            } else if (name === "proc") {
              mkdirSync("/proc/definitely-not-writable", { recursive: true, mode: 0o700 });
            }
            console.log("RESULT", name, "OK", Date.now() - t, "ms");
          } catch (e) {
            console.log("RESULT", name, "THREW", e.code, Date.now() - t, "ms");
          }
          JS
          for p in under-file dev-null-child readonly-dir proc; do
            PROBE=$p timeout 15 node /tmp/probe.cjs
            echo "EXIT[$p]=$?"
          done
