name: diag

# TEMPORARY diagnostic workflow — not triggered by push, only manually.
# Purpose: bisect which test in test/engine/profiles.test.ts hangs in CI
# (vitest prints results per file, so the isolated run gave no clue).

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Bisect which test hangs
        run: |
          set +e
          run() {
            echo "=================== $1"
            timeout 45 npx vitest run test/engine/profiles.test.ts \
              --reporter=verbose --no-file-parallelism -t "$1"
            echo "EXIT=$?"
          }
          run "defaults to the Huginn Cycle"
          run "defines the four alternative methodologies"
          run "only ever names runnable phases"
          run "carries the methodology instruction"
          run "recognises only real profile ids"
          run "produces no receipt"
          run "freezes a receipt for rdd"
          run "writes the receipt to"

      - name: Whole file, bounded
        run: |
          set +e
          timeout 120 npx vitest run test/engine/profiles.test.ts --reporter=verbose --no-file-parallelism
          echo "EXIT=$?"
